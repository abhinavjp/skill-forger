# Layer B — implicit routing for skill-engineer.
# Requires a host runner: measure whether the Skill is selected from
# name + description alone. Do not mix explicit invocation into these results.
#
# Routing only. Nothing here grades what the Skill then does — execution and
# security behaviour live in execution.yaml, so a routing failure and an
# execution failure are never reported as the same number.
#
# Cases carrying a `competition` block are only measurable when every named
# candidate was installed and routable at trial time. A host runner must capture
# the catalog before the trial and mark the case UNMEASURED, not passed, when a
# required candidate is absent.
- version: 1
  id: TR-001
  kind: trigger
  category: positive
  prompt: |
    I want to package our incident-triage workflow as a SKILL.md so the team's
    agents all handle pages the same way. Can you help me design it? Not sure
    what belongs in the description vs the body.
  trials: 3
  expected:
    trigger: true
  graders:
    - type: host-routing
      check:
        selected_skill: skill-engineer
        selected: true
  tags: [create]

